# NimbleZero: no login session and no desktop bus.  The profile "nz" is the upstream
# system-wide profile, for now without Bluetooth and camera handling (neither is set up
# in this version).
wireplumber.profiles = {
  nz = {
    inherits = [ main-systemwide ]
    hardware.bluetooth = disabled
    hardware.video-capture = disabled
  }
}

# One system volume (see nz-admin set_volume): the volume of an output is applied by
# PipeWire itself and the sound chip's own mixer is left where the system put it.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.*" } ]
    actions = { update-props = { api.alsa.soft-mixer = true } }
  }
]
# A new output starts at full volume, not at WirePlumber's 40 %; the system volume is put
# in effect right after the start (S60nz-volume, Store).
wireplumber.settings = {
  device.routes.default-sink-volume = 1.0
}
