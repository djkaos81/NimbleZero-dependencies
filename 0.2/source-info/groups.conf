# Which Buildroot packages form which installable package.  Read by scripts/make-packages.py.
# Everything reachable from [base] roots stays in the base image.

[base]
roots = busybox linux rpi-firmware brcmfmac_sdio-firmware-rpi nz-wifi-nvram wireless-regdb
roots = kmod eudev dropbear wpa_supplicant iw i2c-tools evtest alsa-utils e2fsprogs
roots = nz-drivers nz-diag nz-launcher nz-apps sudo tzdata
roots = skeleton skeleton-init-common skeleton-init-sysv initscripts ifupdown-scripts urandom-scripts
roots = toolchain toolchain-external toolchain-external-bootlin
# package management and downloads (Store)
roots = dpkg nz-compat tar libcurl openssl libopenssl ca-certificates wget
# the real "ip" (BusyBox has one too; apps use options it lacks)
roots = iproute2
# system utilities
roots = bash coreutils util-linux procps-ng htop nano

[nz-python3]
title = Python 3
description = Python 3 with Pillow, NumPy, evdev, qrcode and requests
packages = python3 python-pillow python-numpy python-evdev python-qrcode python-requests
packages = python-certifi python-charset-normalizer python-idna python-urllib3

[nz-ffmpeg]
title = ffmpeg
description = ffmpeg and ffprobe with x264, x265, VP8/9, AV1 decoding, Opus, MP3, Vorbis
packages = ffmpeg

[nz-pulseaudio]
title = PulseAudio
description = PulseAudio sound service
packages = pulseaudio
conflicts = nz-pipewire

[nz-libpulse]
title = PulseAudio client library
description = Library and tools that programs use to reach the sound service (PulseAudio or PipeWire)
section = libs
files = pulseaudio:/usr/lib/libpulse*.so* pulseaudio:/usr/lib/pulseaudio/libpulsecommon* pulseaudio:/usr/bin/pactl pulseaudio:/usr/bin/paplay pulseaudio:/usr/bin/pacat pulseaudio:/usr/bin/parec pulseaudio:/usr/bin/parecord pulseaudio:/etc/pulse/client.conf

[nz-pipewire]
title = PipeWire
description = PipeWire sound service with WirePlumber and PulseAudio compatibility
packages = pipewire wireplumber lua nz-pipewire-conf
conflicts = nz-pulseaudio

[nz-sdl2]
title = SDL2
description = SDL2 with the ttf, image and mixer libraries (sound and input only, no display driver)
packages = sdl2 sdl2_ttf sdl2_image sdl2_mixer

[nz-fonts-dejavu]
title = DejaVu fonts
description = DejaVu fonts
packages = dejavu

[nz-fonts-noto-cjk]
title = Noto Sans CJK fonts
description = Chinese, Japanese and Korean fonts (Noto Sans CJK: regular, medium, bold)
packages = nz-fonts-noto-cjk

[nz-fonts-droid-fallback]
title = Droid Sans Fallback font
description = Fallback font with CJK characters (Droid Sans Fallback)
packages = nz-fonts-droid-fallback

[nz-pygame]
title = pygame
description = pygame 2.6 for Python (SDL2; apps draw to the screen themselves)
packages = nz-pygame
depends = nz-python3

[nz-python3-cryptography]
title = Python cryptography
description = Python modules cryptography, bcrypt and cffi
packages = python-cryptography python-bcrypt python-cffi python-pycparser
depends = nz-python3

[nz-alsa-plugins]
title = ALSA sound service plugins
description = Lets programs that use ALSA directly play through the sound service
packages = alsa-plugins

[nz-python3-hardware]
title = Python hardware modules
description = Python modules serial, spidev, smbus2, pyudev, netifaces
packages = python-serial python-spidev python-smbus2 python-pyudev python-netifaces
# the smbus module of i2c-tools (i2c-tools itself is in the base system)
files = i2c-tools:/usr/lib/python3.13/site-packages/smbus*
depends = nz-python3

[nz-python3-network]
title = Python network modules
description = Python modules aiohttp, websockets, websocket-client, zeroconf
packages = python-aiohttp python-websockets python-websocket-client python-zeroconf
packages = python-aiodns python-pycares python-aiohappyeyeballs python-aiosignal python-attrs python-brotli
packages = python-frozenlist python-multidict python-propcache python-yarl python-ifaddr
depends = nz-python3

[nz-python3-mutagen]
title = Python mutagen
description = Python module for music file tags (mutagen)
packages = python-mutagen
depends = nz-python3

[nz-python3-pip]
title = Python pip
description = pip and setuptools: install Python modules from the internet
packages = python-pip python-setuptools
depends = nz-python3

[nz-mpg123]
title = mpg123
description = MP3 player and libraries (mpg123)
packages = mpg123

[nz-camera-tools]
title = Camera tools
description = v4l2-ctl and the libv4l libraries
packages = libv4l

[nz-m5-runtime]
title = M5Stack app runtime
description = What M5Stack app packages and the M5Stack launcher need to run on NimbleZero
section = runtime
packages = libinput libxkbcommon xkeyboard-config xlib_libX11 xapp_xkbcomp xlib_libxkbfile

